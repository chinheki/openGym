name: Personal OpenGym build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: node scripts/catalogue/cardbook.mjs
      - run: npm run build
        working-directory: frontend
        env:
          VITE_PERSONAL: '1'
      - run: node scripts/catalogue/stage-media.mjs frontend/dist
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Check migration and mixed workouts in a browser
        run: |
          python3 -m http.server 4190 --bind 127.0.0.1 --directory frontend > /tmp/cardbook-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          CARDBOOK_TEST_URL=http://127.0.0.1:4190/dist npm --prefix frontend run test:cardbook
      - uses: actions/upload-artifact@v4
        with:
          name: personal-opengym
          path: frontend/dist

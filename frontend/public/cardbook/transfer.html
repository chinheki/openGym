<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>迁移旧卡册到个人 OpenGym</title><link rel="stylesheet" href="./style.css"><main style="max-width:550px;margin:40px auto;padding:20px"><h1>迁移旧卡册</h1><p>把这台设备本地测试版的照片、卡片、标签和历史合并到你的线上个人版。原存档和线上现有数据都会保留；数据只在两个浏览器页面之间传递，不上传到 GitHub。</p><p id="count" role="status">正在检查本机存档…</p><button id="transfer" class="primary" disabled>迁移到线上个人版</button><p><a href="./index.html">返回本地卡册</a></p></main><script type="module">
import {getAll} from './db.js';
const target='https://chinheki.github.io',button=document.querySelector('#transfer'),status=document.querySelector('#count');
let dest,token,sent=false,payload;
const dataURL=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)});
try{const [cards,images,sessions,settings]=await Promise.all(['cards','images','sessions','settings'].map(getAll));payload={format:'fitness-cardbook',version:1,cards,images:[],sessions,settings};for(const image of images)payload.images.push({id:image.id,width:image.width,height:image.height,data:await dataURL(image.blob),thumbData:await dataURL(image.thumb)});status.textContent=`找到 ${cards.length} 张卡片、${images.length} 张照片、${sessions.length} 次训练。`;button.disabled=false;}catch(e){status.textContent='读取失败：'+e.message}
button.onclick=()=>{token=crypto.randomUUID();sent=false;dest=window.open(`${target}/fitness-cardbook/#/cardbook?from=${encodeURIComponent(location.origin)}&transfer=${token}`,'_blank');status.textContent=dest?'已打开线上个人版，等待合并结果…':'请允许打开迁移页面后重试。'};
window.addEventListener('message',e=>{if(e.source!==dest||e.origin!==target||e.data?.token!==token)return;if(e.data.type==='cardbook:transfer-ready'&&!sent){sent=true;dest.postMessage({type:'cardbook:transfer',token,data:payload},target)}if(e.data.type==='cardbook:transfer-done'){status.textContent=`迁移成功：${payload.cards.length} 张卡片、${payload.images.length} 张照片已合并到线上个人版。原存档保留。`;button.disabled=true}if(e.data.type==='cardbook:transfer-error'){sent=false;status.textContent='迁移未完成，原存档保留：'+e.data.message}});
</script></html>
